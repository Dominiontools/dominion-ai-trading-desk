name: CI

on:
  workflow_dispatch:
  push:
    branches: ["main", "feat/demo-first-foundation", "feat/android-app", "feat/crypto-arbitrage-paper", "feat/complete-demo-trading-engine"]
  pull_request:
    branches: ["main"]

jobs:
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - name: Bundle-check Netlify Functions without deploying
        run: >-
          npx esbuild ctrader-auth-service/netlify/functions/*.mts netlify/functions/*.mts
          --bundle --platform=node --target=node22 --format=esm
          --external:@netlify/blobs --outdir=/tmp/dominion-function-check
      - name: cTrader risk unit tests
        run: node --test ctrader-auth-service/tests/*.test.mjs

  python-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest

  android-native-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - run: npm install
      - name: Build web assets for Capacitor
        run: npm run build
      - name: Generate Capacitor Android project
        run: npx cap add android
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Generate native engine bridge and credential vault
        run: |
          python3 scripts/configure-android-local-api.py
          python3 scripts/add-android-secure-credentials.py
      - name: Compile generated Android Java bridge only (no APK)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:compileDebugJavaWithJavac --no-daemon

  live-public-market-smoke:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[live-smoke]')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run read-only public 52-market scanner smoke check
        run: python scripts/smoke_public_crypto_scanner.py
