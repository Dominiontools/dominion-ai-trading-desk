name: Android native bridge compile check

on:
  push:
    branches:
      - feat/complete-demo-trading-engine
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-generated-android-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Install web dependencies
        run: npm install

      - name: Generate Capacitor Android project
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Generate native engine bridge and credential vault
        run: |
          python3 scripts/configure-android-local-api.py
          python3 scripts/add-android-secure-credentials.py

      - name: Compile Android Java bridge only (no APK)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:compileDebugJavaWithJavac --no-daemon

