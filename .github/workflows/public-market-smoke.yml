name: Public market smoke

on:
  push:
    branches: ["feat/complete-demo-trading-engine"]
    paths:
      - "scripts/smoke_public_crypto_scanner.py"
      - ".github/workflows/public-market-smoke.yml"

jobs:
  public-market-smoke:
    if: contains(github.event.head_commit.message, '[live-smoke]')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run read-only public 52-market smoke check
        run: python scripts/smoke_public_crypto_scanner.py
